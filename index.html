<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rắn Săn Mồi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 12px; text-align: center; }
  .score { display: flex; gap: 12px; margin-bottom: 12px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 8px 16px; text-align: center; min-width: 110px; }
  .box small { display: block; color: #94a3b8; font-size: 12px; }
  .box b { font-size: 22px; }
  canvas { background: #020617; border: 3px solid #22c55e; border-radius: 14px; max-width: 100%; width: 400px; height: 400px; touch-action: none; }
  .controls { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; justify-content: center; }
  button { background: #22c55e; color: #052e16; border: 0; padding: 12px 20px; border-radius: 999px; font-weight: 800; font-size: 16px; cursor: pointer; }
  button.ghost { background: #1e293b; color: #f1f5f9; border: 1px solid #334155; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 6px; margin-top: 6px; }
  .pad button { background: #1e293b; color: white; border: 1px solid #334155; border-radius: 14px; font-size: 24px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .pad button:active { background: #22c55e; color: #052e16; }
  .up { grid-column: 2; grid-row: 1; } .left { grid-column: 1; grid-row: 2; } .right { grid-column: 3; grid-row: 2; } .down { grid-column: 2; grid-row: 3; }
  #msg { margin-top: 10px; color: #fbbf24; font-weight: 700; min-height: 22px; text-align: center; }
  .hint { color: #94a3b8; font-size: 13px; text-align: center; margin-top: 8px; max-width: 400px; }
</style>
</head>
<body>
<h1>🐍 Rắn Săn Mồi</h1>
<p class="sub">Ăn mồi để dài ra, đừng cắn chính mình hay đâm vào tường!</p>
<div class="score">
  <div class="box"><small>Điểm</small><b id="score">0</b></div>
  <div class="box"><small>Kỷ lục</small><b id="best">0</b></div>
</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="msg">Bấm Bắt đầu để chơi</div>
<div class="controls">
  <button id="startBtn" onclick="startGame()">▶ Bắt đầu</button>
  <button class="ghost" onclick="togglePause()">⏸ Tạm dừng</button>
</div>
<div class="pad">
  <button class="up" onclick="setDir(0,-1)">▲</button>
  <button class="left" onclick="setDir(-1,0)">◀</button>
  <button class="right" onclick="setDir(1,0)">▶</button>
  <button class="down" onclick="setDir(0,1)">▼</button>
</div>
<p class="hint">Trên máy tính dùng phím mũi tên hoặc WASD. Trên điện thoại bấm nút điều hướng ở trên, hoặc vuốt trên màn hình chơi.</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 20, cols = 20, rows = 20;
let snake, dir, nextDir, food, score, best = +(localStorage.getItem('snake-best') || 0), timer = null, speed = 140, paused = false, running = false;
document.getElementById('best').textContent = best;
function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir; score = 0; speed = 140; paused = false;
  document.getElementById('score').textContent = '0';
  placeFood(); draw();
}
function placeFood() {
  while (true) {
    food = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
    if (!snake.some(s => s.x===food.x && s.y===food.y)) break;
  }
}
function draw() {
  ctx.fillStyle = '#020617'; ctx.fillRect(0,0,400,400);
  ctx.fillStyle = '#ef4444';
  ctx.beginPath(); ctx.arc(food.x*grid+10, food.y*grid+10, 8, 0, Math.PI*2); ctx.fill();
  snake.forEach((s,i) => {
    ctx.fillStyle = i===0 ? '#4ade80' : '#22c55e';
    ctx.fillRect(s.x*grid+1, s.y*grid+1, grid-2, grid-2);
  });
}
function step() {
  if (paused || !running) return;
  dir = nextDir;
  const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
  if (head.x<0 || head.y<0 || head.x>=cols || head.y>=rows || snake.some(s=>s.x===head.x && s.y===head.y)) return gameOver();
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score += 10; document.getElementById('score').textContent = score;
    if (score>best) { best=score; localStorage.setItem('snake-best', best); document.getElementById('best').textContent = best; }
    if (speed>70) speed -= 4;
    placeFood();
  } else snake.pop();
  draw();
  clearTimeout(timer); timer = setTimeout(step, speed);
}
function gameOver() {
  running = false; clearTimeout(timer);
  document.getElementById('msg').textContent = '💥 Thua rồi! Được ' + score + ' điểm. Bấm Bắt đầu để chơi lại.';
  document.getElementById('startBtn').textContent = '↻ Chơi lại';
}
function startGame() {
  reset(); running = true; document.getElementById('msg').textContent = '';
  document.getElementById('startBtn').textContent = '↻ Chơi lại';
  clearTimeout(timer); timer = setTimeout(step, speed);
}
function togglePause() {
  if (!running) return; paused = !paused;
  document.getElementById('msg').textContent = paused ? '⏸ Đang tạm dừng' : '';
  if (!paused) { clearTimeout(timer); timer = setTimeout(step, speed); }
}
function setDir(x,y) {
  if (dir.x===-x && dir.y===-y) return;
  nextDir = {x,y};
  if (!running) startGame();
}
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='arrowup'||k==='w') setDir(0,-1);
  if (k==='arrowdown'||k==='s') setDir(0,1);
  if (k==='arrowleft'||k==='a') setDir(-1,0);
  if (k==='arrowright'||k==='d') setDir(1,0);
  if (k===' ') { e.preventDefault(); running ? togglePause() : startGame(); }
});
let tx=0, ty=0;
canvas.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if (Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else if (Math.abs(dy)>10) setDir(0,dy>0?1:-1);
}, {passive:true});
reset();
</script>
</body>
</html>
